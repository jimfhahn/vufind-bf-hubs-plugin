<notebook theme="air">
  <title>BIBFRAME Hub family explorer</title>
  <script id="1" type="text/markdown">
    # BIBFRAME Hub family explorer

    See how a book, film, opera or translation is connected to the other works in its
    **bibliographic family**: adaptations, sequels, parodies, translations, series.

    The data is the Library of Congress **BIBFRAME Hubs** (a *Hub* is an authorized name/title
    heading with a URI, e.g. *Austen, Jane. Pride and prejudice*). About 918K Hubs are linked to at
    least one other Hub by 544K typed relations; that connected part of the graph is what you
    browse here. It loads from [Parquet on Hugging Face](https://huggingface.co/datasets/jimfhahn/lc-bibframe-hubs)
    and runs entirely in your browser, with no server.

    **How to use it:** search for a title, pick a Hub, and the page (1) climbs from that Hub up to
    the original work, then (2) shows everything related to that work, most surprising first.
    Click any title to make it the new center. Background and sources are in
    [Design notes](#design-notes) at the end.
  </script>
  <script id="23" type="module">
    // The Space is shown inside an iframe on huggingface.co and github.com refuses to be framed,
    // so every external link in the prose must open in a new tab.
    for (const a of document.querySelectorAll('a[href^="http"]')) { a.target = "_blank"; a.rel = "noopener"; }
  </script>
  <script id="2" type="module" pinned>
    // Load the two Parquet files into an in-browser DuckDB (~97 MB on first load). We fetch the
    // bytes ourselves and register them as in-memory files: DuckDB-WASM's own HTTP reader trips
    // on the CDN redirect in some browsers/webviews ("No files found that match the pattern").
    // Sources, in order: a same-origin copy (deploy-space.sh puts one in ./data/), then the
    // dataset repo. Both end up on the Xet CDN, which intermittently serves a cached
    // Access-Control-Allow-Origin for a different origin (Firefox: "does not match"); two
    // independent CDN objects give the loader a second chance.
    const DATASET = "https://huggingface.co/datasets/jimfhahn/lc-bibframe-hubs/resolve/main/";
    const SOURCES = [new URL("./data/", location.href).href, DATASET];
    const db = await DuckDBClient.of();
    const t0 = performance.now();
    const status = display(html`<p>Loading the graph (~97 MB, once)…`);
    const isParquet = (b) => b.length > 8 && b[0] === 0x50 && b[1] === 0x41 && b[2] === 0x52 && b[3] === 0x31; // "PAR1"
    async function fetchParquet(name) {
      const errors = [];
      for (const base of SOURCES) {
        try {
          const res = await fetch(base + name);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const bytes = new Uint8Array(await res.arrayBuffer());
          if (!isParquet(bytes)) throw new Error("not a Parquet file"); // e.g. dev-server HTML fallback
          return {bytes, base};
        } catch (e) {
          errors.push(`${base}${name}: ${e.message}`);
        }
      }
      throw new Error(`Could not load ${name}:\n${errors.join("\n")}`);
    }
    async function attach(name) {
      const {bytes, base} = await fetchParquet(name);
      const mb = (bytes.length / 1e6).toFixed(0); // buffer is transferred to the worker (detached) below
      await db._db.registerFileBuffer(name, bytes);
      status.append(html` <small>${name} ${mb} MB ✓${base === DATASET ? " (dataset)" : ""}</small>`);
    }
    await Promise.all([attach("relations.parquet"), attach("hubs_connected.parquet")]);
    await db.query(`CREATE TABLE rels AS SELECT source_id, target_id, rel_type FROM read_parquet('relations.parquet')`);
    await db.query(`CREATE TABLE hubs AS SELECT hub_id, title, marc_key, media, agents FROM read_parquet('hubs_connected.parquet')`);
    await db.query(`CREATE TABLE deg AS SELECT id, count(*) AS n FROM (SELECT source_id AS id FROM rels UNION ALL SELECT target_id FROM rels) GROUP BY id`);
    const counts = await db.queryRow(`SELECT (SELECT count(*) FROM hubs) AS hubs, (SELECT count(*) FROM rels) AS rels`);
    display(html`<p>Ready: ${counts.hubs.toLocaleString()} connected Hubs, ${counts.rels.toLocaleString()} relations (${((performance.now() - t0) / 1000).toFixed(1)}s).`);
  </script>
  <script id="3" type="module">
    // Surprise tiers, copied verbatim from RelationshipInferrer.php so the notebook and the
    // VuFind plugin agree on what counts as a surprising relationship.
    const TIERS = {
      1: ["inspirationfor", "inspiredby", "parodyof", "imitationof", "derivative", "graphicnovelizationof",
          "novelizationof", "critiqueof", "commentaryon", "analysisof"],
      2: ["adaptedasmotionpicture", "motionpictureadaptationof", "adaptedastelevisionprogram", "televisionadaptationof",
          "operaadaptationof", "musicaltheatreadaptationof", "musicaltheatreadaptionof", "adaptedasmusicaltheatre",
          "variationsbasedon", "musicalvariationsbasedon", "dramatizationof", "radioadaptationof", "adaptedaslibretto",
          "verseadaptationof", "musicalsettingof", "settomusicas", "oratorioadaptationof", "incidentalmusicfor",
          "cadenzacomposedfor", "musicalvariations", "motionpicturescreenplaybasedon", "screenplayformotionpicture",
          "librettobasedon"],
      3: ["sequel", "sequelto", "prequel", "prequelto", "basedon", "adaptedas", "adaptationof", "librettofor", "libretto", "remakeof"],
      4: ["continuedby", "continuationof", "continues", "precededby", "preceededby", "succeededby", "expandedas",
          "expandedversionof", "abridgedas", "abridgementof", "revisionof", "revisedas", "augmentationof", "augmentedby",
          "complementedby", "supplementto", "supplement", "mergerof", "mergedtoform", "replacementof", "replacedby",
          "paraphraseof", "freetranslationof", "absorbedby", "absorptionof", "separatedfrom", "continuedinpartby"],
      5: ["translator", "translationof", "translatedas", "editor", "compiler", "editorofcompilation", "inseries",
          "containedin", "containerof", "contains", "subseriesof", "seriescontainerof", "issuedas", "author", "creator",
          "contributor", "publisher", "issuingbody", "sponsoringbody", "founder", "filmdirector", "performer", "actor",
          "singer", "producer", "lyricist", "composer", "artist", "illustrator", "photographer", "host", "dedicatee",
          "honouree", "addressee", "formerowner", "writerofaddedcommentary", "writerofintroduction",
          "writerofsupplementarytextualcontent", "writerofaddedtext", "writerofforeword", "attributedname", "related",
          "descriptionof", "setting", "musicformotionpicture", "motionpicturemusic", "musicfortelevisionprogram",
          "incidentalmusic", "musicfor"]
    };
    const TIER_OF = new Map(Object.entries(TIERS).flatMap(([t, slugs]) => slugs.map((s) => [s, +t])));
    const tierOf = (slug) => TIER_OF.get(slug) ?? 5;
    const TIER_LABEL = {1: "Creative transformation", 2: "Cross-medium adaptation", 3: "Sequel / adaptation", 4: "Series / structural", 5: "Predictable"};
    const TIER_COLOR = {1: "#b2182b", 2: "#ef8a62", 3: "#d9a300", 4: "#67a9cf", 5: "#999999"};
    const EXPRESSION_EDGES = new Set(["translationof", "arrangementof"]);
    const SERIES_EDGES = new Set(["inseries", "containedin", "containerof", "contains", "subseriesof", "seriescontainerof", "issuedas"]);
    const hubUrl = (id) => `https://id.loc.gov/resources/hubs/${id}`;
    // "1001 $aAusten, Jane,$d1775-1817.$tPride and prejudice" → "Austen, Jane"; 130 headings have no $a name.
    const authorOf = (marcKey) => {
      if (!marcKey || !/^[17]/.test(marcKey)) return null;
      const m = marcKey.match(/\$a([^$]+)/);
      return m ? m[1].replace(/[,.;:\s]+$/, "") : null;
    };
    const rows = (table) => table.toArray().map((r) => {
      const o = r.toJSON();
      for (const k of ["media", "agents"]) if (o[k] != null) o[k] = Array.from(o[k]);
      return o;
    });
  </script>
  <script id="4" type="text/markdown">
    ## 1. Find a Hub

    Type a title or author. Results with the most connections come first, so the original work is
    usually at the top. Try picking a translation (e.g. *Pride and prejudice. Turkish*) to see the
    climb in step 2.
  </script>
  <script id="5" type="module" pinned>
    // Deep link: ?hub=<uuid> opens straight on that Hub (used by the VuFind plugin sidebar).
    const hubParam = new URLSearchParams(location.search).get("hub");
    const q = view(Inputs.text({label: "Search", placeholder: "title or author…", value: hubParam ? "" : "Pride and prejudice", submit: true}));
  </script>
  <script id="6" type="module">
    const candidates = q.trim().length < 3 ? [] : rows(await db.query(
      `SELECT h.hub_id, h.title, h.marc_key, h.media, coalesce(d.n, 0) AS degree
       FROM hubs h LEFT JOIN deg d ON d.id = h.hub_id
       WHERE h.title ILIKE ? OR h.marc_key ILIKE ?
       ORDER BY degree DESC, h.title LIMIT 40`,
      [`%${q.trim()}%`, `%${q.trim()}%`]
    ));
  </script>
  <script id="7" type="module" pinned>
    const chosen = view(Inputs.select(candidates, {
      label: "Hub",
      value: candidates[0],
      format: (d) => `${d.title}  ·  ${d.marc_key ?? "—"}  ·  ${d.degree} links`
    }));
  </script>
  <script id="8" type="module">
    // The focused Hub. Set from the search box, and re-set when you click a node in the tree.
    const focusId = Mutable(null);
    const setFocus = (id) => {
      if (id) history.replaceState(null, "", `?hub=${encodeURIComponent(id)}`);
      return (focusId.value = id);
    };
  </script>
  <script id="9" type="module">
    setFocus(chosen?.hub_id ?? hubParam ?? null);
  </script>
  <script id="10" type="text/markdown">
    ## 2. Climb to the original work

    If the Hub you picked is a translation or arrangement, follow its `translationof` /
    `arrangementof` links upward until there is nothing above. That Hub is the **family root**
    (the *Work*, in IFLA-LRM terms) and everything below is drawn around it.
  </script>
  <script id="11" type="module">
    const climb = await (async () => {
      if (!focusId) return null;
      const path = [];
      let cur = focusId;
      const seen = new Set([cur]);
      for (let i = 0; i < 8; i++) {
        const row = await db.queryRow(
          `SELECT r.target_id, r.rel_type, h.title FROM rels r JOIN hubs h ON h.hub_id = r.target_id
           WHERE r.source_id = ? AND r.rel_type IN ('translationof', 'arrangementof') LIMIT 1`, [cur]);
        if (!row || seen.has(row.target_id)) break;
        path.push({from: cur, to: row.target_id, rel: row.rel_type, toTitle: row.title});
        cur = row.target_id;
        seen.add(cur);
      }
      const root = rows(await db.query(`SELECT * FROM hubs WHERE hub_id = ?`, [cur]))[0];
      return {rootId: cur, root, path, entered: focusId};
    })();
  </script>
  <script id="12" type="module">
    if (!climb) display(html`<p><i>No Hub selected. Search above.</i>`);
    else if (climb.path.length === 0) display(html`<p><b>${climb.root.title}</b> <small>(${climb.root.marc_key ?? ""})</small> is already the family root, so there is nothing to climb. <a href=${hubUrl(climb.rootId)} target="_blank">View on id.loc.gov ↗</a>`);
    else display(html`<p>Started at <b>${chosen?.title ?? climb.entered}</b>${climb.path.map((p) => html` → <small>${p.rel}</small> → <b>${p.toTitle}</b>`)}.<br>Family root: <a href=${hubUrl(climb.rootId)} target="_blank">${climb.root.title} ↗</a> <small>(${climb.root.marc_key ?? ""})</small>`);
  </script>
  <script id="13" type="module">
    // One row per family member: every Hub one hop from the root, in either direction,
    // deduplicated by Hub (keeping the most surprising relationship type).
    const family = await (async () => {
      if (!climb) return [];
      const id = climb.rootId;
      const raw = rows(await db.query(
        `SELECT CASE WHEN r.source_id = ? THEN 'out' ELSE 'in' END AS dir, r.rel_type,
                h.hub_id, h.title, h.marc_key, h.media, h.agents, coalesce(d.n, 0) AS degree
         FROM rels r
         JOIN hubs h ON h.hub_id = CASE WHEN r.source_id = ? THEN r.target_id ELSE r.source_id END
         LEFT JOIN deg d ON d.id = h.hub_id
         WHERE r.source_id = ? OR r.target_id = ?`, [id, id, id, id]));
      const rootAgents = new Set(climb.root.agents ?? []);
      const byHub = new Map();
      for (const r of raw) {
        const isExpression = (r.dir === "in" && EXPRESSION_EDGES.has(r.rel_type)) || (r.dir === "out" && r.rel_type === "translatedas");
        const tier = tierOf(r.rel_type);
        const group = isExpression ? "Expressions"
          : tier <= 3 ? "Derivative works"
          : (tier === 4 || SERIES_EDGES.has(r.rel_type)) ? "Series & parts"
          : "Other related";
        const agents = r.agents ?? [];
        const sameAuthor = agents.length && rootAgents.size ? agents.some((a) => rootAgents.has(a)) : null;
        const row = {...r, tier, group, sameAuthor, url: hubUrl(r.hub_id)};
        const prev = byHub.get(r.hub_id);
        if (!prev || row.tier < prev.tier) byHub.set(r.hub_id, row);
      }
      return [...byHub.values()].sort((a, b) => a.tier - b.tier || d3.ascending(a.title, b.title));
    })();
  </script>
  <script id="14" type="text/markdown">
    ## 3. The family

    Everything one step away from the root, in four groups:

    - **Derivative works**: adaptations, sequels, parodies, films, operas. The interesting part;
      open by default and colored by how surprising the relationship is (red = most surprising).
    - **Expressions**: translations and arrangements. Predictable, so collapsed by default
      (opened automatically if that is where you started).
    - **Series & parts**: whole/part, series, continuations, revisions.
    - **Other related**: links with no specific type.

    **Click a title** to make it the new root. Families overlap, and following a film adaptation
    into *its* family is where the unexpected connections show up. **Shift-click** opens the Hub
    on `id.loc.gov`. Choose the **indented tree** (hierarchy plus columns) or a **tidy tree**
    (hierarchy only).
  </script>
  <script id="15" type="module" pinned>
    const shown = view(Inputs.checkbox(["Derivative works", "Expressions", "Series & parts", "Other related"], {
      label: "Show", value: ["Derivative works", "Series & parts", "Other related"]
    }));
    const layout = view(Inputs.radio(["Indented tree", "Tidy tree"], {label: "Layout", value: "Indented tree"}));
  </script>
  <script id="16" type="module">
    const groups = d3.groups(family, (d) => d.group);
    const groupOrder = ["Derivative works", "Expressions", "Series & parts", "Other related"];
    const legend = html`<div style="display:flex;gap:1em;flex-wrap:wrap;font:12px sans-serif;margin:0.5em 0">
      <span style="color:#666">Surprise:</span>
      ${[1, 2, 3, 4, 5].map((t) => html`<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${TIER_COLOR[t]};margin-right:4px"></span>${TIER_LABEL[t]}</span>`)}
      <span>◐ different author &nbsp; ▣ different medium (film, music…)</span>
      <span style="color:#666">${family.length} family members: ${groupOrder.map((g) => `${g} ${groups.find(([k]) => k === g)?.[1].length ?? 0}`).join(" · ")}</span>
    </div>`;
    display(legend);
  </script>
  <script id="17" type="module">
    // If the user entered through an expression (bottom-up), keep that branch visible so
    // they can see where they started relative to the rest of the family.
    const enteredBelowRoot = climb && climb.entered !== climb.rootId;
    const shownGroups = enteredBelowRoot ? [...new Set([...shown, "Expressions"])] : shown;
    const treeData = climb && {
      name: climb.root.title, hub_id: climb.rootId, root: true,
      children: groupOrder
        .filter((g) => shownGroups.includes(g))
        .map((g) => ({name: g, children: (groups.find(([k]) => k === g)?.[1] ?? []).map((d) => ({...d, name: d.title}))}))
        .filter((g) => g.children.length)
    };
    const label = (d) => {
      const media = (d.media ?? []).filter((m) => m !== "Text");
      const mediaMark = media.length && !(climb.root.media ?? []).some((m) => media.includes(m)) ? " ▣" : "";
      const authorMark = d.sameAuthor === false ? " ◐" : "";
      const author = authorOf(d.marc_key);
      const rootAuthor = authorOf(climb.root.marc_key);
      const t = d.title.length > 44 ? d.title.slice(0, 43) + "…" : d.title;
      const by = author && author !== rootAuthor ? ` (${author.length > 24 ? author.slice(0, 23) + "…" : author})` : "";
      const here = d.hub_id === climb.entered ? "  ◀ you started here" : "";
      return `${t}${by}${mediaMark}${authorMark}${here}`;
    };
    const tooltip = (d) => `${d.title}\n${d.marc_key ?? ""}\n${d.dir === "out" ? "root → " + d.rel_type + " → this" : "this → " + d.rel_type + " → root"}\nmedia: ${(d.media ?? []).join(", ") || "none"}\n${d.degree} links · tier ${d.tier}\n(click to re-root · shift-click opens id.loc.gov)`;
    const onClick = (event, d) => {
      if (event.shiftKey) window.open(hubUrl(d.hub_id), "_blank");
      else setFocus(d.hub_id);
    };
  </script>
  <script id="18" type="module">
    if (!treeData) display(html`<p><i>Nothing to draw.</i>`);
    else if (!treeData.children.length) display(html`<p><i>No family members in the selected groups.</i>`);
    else if (layout === "Indented tree") {
      // FrbrVis-style: hierarchy in the first column, metadata in the rest. Groups toggle
      // locally (no re-render); Expressions start collapsed unless the user entered through one.
      const dot = (color) => html`<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${color};margin-right:6px;vertical-align:middle"></span>`;
      const rootAuthor = authorOf(climb.root.marc_key);
      const cell = (v, style = "") => html`<td style="padding:2px 10px;white-space:nowrap;${style}">${v}</td>`;
      const head = html`<tr style="text-align:left;color:#666;border-bottom:1px solid #ddd">
        ${["Family", "Relationship to root", "Tier", "Author", "Medium", "Links", ""].map((h) => html`<th style="padding:4px 10px;font-weight:600">${h}</th>`)}</tr>`;
      const rootRow = html`<tr style="font-weight:bold">${cell(html`${dot("#222")}${climb.root.title}`)}${cell("root (LRM Work)", "color:#666;font-weight:normal")}${cell("")}${cell(rootAuthor ?? "", "font-weight:normal")}${cell((climb.root.media ?? []).join(", "), "font-weight:normal")}${cell(family.length, "text-align:right;font-weight:normal")}${cell(html`<a href=${hubUrl(climb.rootId)} target="_blank">↗</a>`)}</tr>`;
      const body = treeData.children.flatMap((g) => {
        const open = !(g.name === "Expressions" && !g.children.some((d) => d.hub_id === climb.entered));
        const kids = g.children.map((d) => {
          const author = authorOf(d.marc_key);
          const entered = d.hub_id === climb.entered;
          const media = (d.media ?? []).filter((m) => m !== "Text").join(", ");
          const rel = d.dir === "out" ? `root → ${d.rel_type} → this` : `this → ${d.rel_type} → root`;
          const tr = html`<tr style="${entered ? "background:#fff6d6;font-weight:bold" : ""}" hidden=${!open}>
            ${cell(html`<span style="padding-left:2.6em">${dot(TIER_COLOR[d.tier])}<a href="#" style="color:inherit;text-decoration:none;border-bottom:1px dotted #999" title="click to re-root · shift-click opens id.loc.gov" onclick=${(e) => { e.preventDefault(); onClick(e, d); }}>${d.title}</a>${entered ? " ◀ you started here" : ""}</span>`)}
            ${cell(rel, "color:#555")}
            ${cell(`${d.tier} · ${TIER_LABEL[d.tier]}`, "color:#555")}
            ${cell(author ? (author !== rootAuthor ? html`<b>${author}</b>` : author) : "", "")}
            ${cell(media, "")}
            ${cell(d.degree, "text-align:right")}
            ${cell(html`<a href=${d.url} target="_blank">↗</a>`)}</tr>`;
          return tr;
        });
        const caret = html`<span style="display:inline-block;width:1.2em;cursor:pointer;user-select:none">${open ? "▾" : "▸"}</span>`;
        const groupRow = html`<tr style="cursor:pointer;background:#f6f6f6" onclick=${() => { const show = kids[0]?.hidden ?? false; kids.forEach((k) => (k.hidden = !show)); caret.textContent = show ? "▾" : "▸"; }}>
          ${cell(html`<span style="padding-left:1em;font-weight:600">${caret}${g.name} <span style="color:#888;font-weight:normal">(${g.children.length})</span></span>`)}
          <td colspan="6" style="padding:2px 10px;color:#888">${g.name === "Expressions" ? "LRM Expressions: translations and arrangements of the Work" : g.name === "Derivative works" ? "related Works: adaptations, sequels, parodies, derivatives" : g.name === "Series & parts" ? "whole/part, series, continuation, revision" : "generic links (related, relatedwork) and other tier-5 relations"}</td></tr>`;
        return [groupRow, ...kids];
      });
      display(html`<div style="overflow-x:auto"><table style="border-collapse:collapse;font:13px sans-serif;min-width:100%">${head}${rootRow}${body}</table></div>`);
    }
    else {
      const root = d3.hierarchy(treeData);
      // Fixed column spacing; the SVG grows to fit and scrolls horizontally on narrow screens.
      const left = 24, right = 440, dx = 16, dy = 200;
      d3.tree().nodeSize([dx, dy])(root);
      let x0 = Infinity, x1 = -Infinity;
      root.each((d) => { if (d.x > x1) x1 = d.x; if (d.x < x0) x0 = d.x; });
      const height = x1 - x0 + dx * 3;
      const svgWidth = left + dy * root.height + right;
      const svg = d3.create("svg")
        .attr("width", svgWidth).attr("height", height)
        .attr("viewBox", [-left, x0 - dx * 1.5, svgWidth, height])
        .style("font", "12px sans-serif").style("display", "block");
      svg.append("g").attr("fill", "none").attr("stroke", "#bbb").attr("stroke-width", 1.2)
        .selectAll("path").data(root.links()).join("path")
        .attr("d", d3.linkHorizontal().x((d) => d.y).y((d) => d.x))
        .attr("stroke", (d) => d.target.data.tier ? TIER_COLOR[d.target.data.tier] : "#bbb")
        .attr("stroke-opacity", 0.6);
      const node = svg.append("g").selectAll("g").data(root.descendants()).join("g")
        .attr("transform", (d) => `translate(${d.y},${d.x})`);
      node.append("circle")
        .attr("r", (d) => d.data.root ? 7 : d.data.hub_id ? 4.5 : 3)
        .attr("fill", (d) => d.data.root ? "#222" : d.data.tier ? TIER_COLOR[d.data.tier] : "#fff")
        .attr("stroke", (d) => d.data.hub_id === climb.entered && !d.data.root ? "#222" : d.data.hub_id ? "none" : "#666")
        .attr("stroke-width", (d) => d.data.hub_id === climb.entered && !d.data.root ? 2.5 : 1);
      node.filter((d) => d.data.hub_id && !d.data.root).style("cursor", "pointer").on("click", (e, d) => onClick(e, d.data))
        .append("title").text((d) => tooltip(d.data));
      node.append("text")
        .attr("dy", (d) => d.data.root ? "-0.9em" : "0.32em")
        .attr("x", (d) => d.data.root ? -6 : d.children ? -10 : 8)
        .attr("text-anchor", (d) => d.data.root ? "start" : d.children ? "end" : "start")
        .attr("font-weight", (d) => d.data.root || !d.data.hub_id || d.data.hub_id === climb.entered ? "bold" : "normal")
        .text((d) => d.data.root ? d.data.name : d.data.hub_id ? label(d.data) : `${d.data.name} (${d.children.length})`)
        .attr("fill", (d) => d.data.hub_id ? "currentColor" : "#555")
        .style("cursor", (d) => d.data.hub_id && !d.data.root ? "pointer" : null)

  <script id="22" type="text/markdown">
    ---

    ## Design notes

    **Why climb first, then fan out?** Arastoopoor (2022, *Library Hi Tech* 40:1) found that people
    with no particular book in mind picture a family **top-down** (work → translations and
    versions), but people looking for a specific edition or translation navigate **bottom-up**,
    from that item to the work and across to its siblings. The page supports both: step 2 is the
    climb, step 3 the fan-out, and "you started here" marks your entry point.

    **Why show the relationship type?** Pauman Budanović & Žumer (2021, *CCQ* 59:7) built and tested
    a cataloging interface on IFLA-LRM entities and the relationships between them, rather than on
    flat records. Here the relationship (*sequel*, *parody of*, *film adaptation*) gets its own
    column for the same reason: it is the most informative thing about a family member.

    **Why an indented tree?** Merčun, Žumer & Aalberg's **FrbrVis** studies (*J. Doc.* 2016;
    *JASIST* 2017) tested four ways of drawing work families: indented tree, radial tree,
    circle-pack, and sunburst. The indented tree and the sunburst did best on both speed and user
    preference. The indented tree also reads like a table, so extra columns fit naturally; the
    tidy tree is there for comparison.

    **Surprise tiers.** Colors follow the companion
    [VuFind plugin](https://github.com/jimfhahn/vufind-bf-hubs-plugin): tier 1 creative
    transformations (parody, inspiration), tier 2 cross-medium adaptations (film, opera), tier 3
    continuations and other adaptations, tier 4 serial/structural links, tier 5 predictable ones
    (translations, series membership).

    **Data.** [jimfhahn/lc-bibframe-hubs](https://huggingface.co/datasets/jimfhahn/lc-bibframe-hubs),
    the Library of Congress BIBFRAME Hubs bulk dump (2026-05-05) converted to Parquet; the dataset
    card documents the schema. Source code for this page and the plugin:
    [jimfhahn/vufind-bf-hubs-plugin](https://github.com/jimfhahn/vufind-bf-hubs-plugin).
  </script>
