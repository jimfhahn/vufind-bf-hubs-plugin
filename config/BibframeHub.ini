[Connection]
; Base URL for the LC Linked Data Service
baseUrl = "https://id.loc.gov"
; User-Agent header (LC requires this)
userAgent = "VuFind-BibframeHub/1.0"
; HTTP timeout in seconds
timeout = 10
; Maximum Hub results to fetch
maxResults = 20

[Neo4j]
; Legacy backend: Neo4j graph with n10s-imported BIBFRAME Hubs dataset.
; Only used when [HubStore] backend = "neo4j". Prefer the sql backend
; (no extra service to run); see [HubStore] below.
enabled = false
; Neo4j connection URI (HTTP API — the plugin uses cURL, not Bolt).
; Default points at the standard Neo4j HTTP port. The Docker dev setup
; uses port 7475 to avoid clashing with other local Neo4j instances;
; see docker/local/config/vufind/BibframeHub.ini for that override.
uri = "http://localhost:7474"
; Neo4j credentials — set these to match your Neo4j instance
username = "neo4j"
password = "CHANGE_ME"
; Neo4j database name
database = "neo4j"

[HubStore]
; Which local graph store backs Hub resolution, enrichment and the fallback
; when id.loc.gov is unavailable:
;   sql   - tables in VuFind's own database, loaded from the Hugging Face
;           Parquet export with `php public/index.php bibframehub/load-hubs`
;           (see tools/hf-dataset/README.md). No extra services required.
;   neo4j - the n10s graph configured in [Neo4j] (legacy).
;   none  - disable the local store (fast-lane records + live RDF only).
; Default: neo4j if [Neo4j] enabled = true, otherwise sql.
backend = "sql"

[Display]
; Validate that Hub URIs resolve on id.loc.gov before displaying.
; The bulk TTL dataset may contain URIs that no longer exist.
; Uses cached HEAD requests so each URI is only checked once per TTL period.
validateUris = true
; How long (seconds) to cache a URI validation result. Default: 86400 (24 hours)
validationCacheTtl = 86400
; Maximum number of related works to display after validation
maxDisplayResults = 15
; Optional: base URL of a hosted Hub family explorer (Observable notebook in
; notebooks/). When set, the sidebar shows an "Explore this work's family" link
; to {explorerUrl}?hub={uuid}. Leave empty to hide the link.
; explorerUrl = "https://jimfhahn-bibframe-hub-explorer.static.hf.space/"
; Optional: override cache file path (default: VUFIND_LOCAL_DIR/cache/bibframehub_uri_validation.json)
; validationCachePath = ""
