[Connection]
baseUrl = "https://id.loc.gov"
userAgent = "VuFind-BibframeHub/1.0"
timeout = 10
maxResults = 20

[Neo4j]
; Legacy backend, unused while [HubStore] backend = "sql". To go back to
; Neo4j set enabled = true here and backend = "neo4j" below; from inside
; Docker, host.docker.internal reaches a Neo4j running on the host.
enabled = false
uri = "http://host.docker.internal:7474"
username = "neo4j"
password = "bibframe123"
database = "neo4j"

[HubStore]
backend = "sql"

[Display]
validateUris = true
validationCacheTtl = 86400
maxDisplayResults = 15
explorerUrl = "https://jimfhahn-bibframe-hub-explorer.static.hf.space/"
